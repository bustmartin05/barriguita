<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff5f8">
  <title>No encontramos esa página | Pastelería Barriguitas</title>
  <meta name="description" content="No encontramos la página que buscabas. Volvé a la tienda de Pastelería Barriguitas.">
  <link rel="icon" type="image/png" href="/pasteleria/assets/images/nene-torta-choco-trans.png">
  <link rel="apple-touch-icon" href="/pasteleria/assets/images/nene-torta-choco-trans.png">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff5f8;
      color: #334155;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    main { width: min(100%, 480px); }

    img {
      display: block;
      width: min(76vw, 290px);
      max-height: 42vh;
      object-fit: contain;
      margin: 0 auto 16px;
    }

    h1 {
      margin: 0 0 10px;
      color: #d81b60;
      font-size: clamp(1.65rem, 6vw, 2.2rem);
    }

    p {
      margin: 0 auto 22px;
      line-height: 1.6;
    }

    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 11px 22px;
      border-radius: 999px;
      background: #d81b60;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #92400e;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main aria-labelledby="not-found-title">
    <img src="/pasteleria/assets/images/nene-torta-choco-trans.png" alt="El nene de Barriguitas con su torta de chocolate">
    <h1 id="not-found-title">¡Ups! No encontramos esta página</h1>
    <p>Puede que el enlace haya cambiado o que la dirección esté mal escrita. Volvamos a la casita de chocolate.</p>
    <a href="/pasteleria/">Ir a la tienda</a>
  </main>
</body>
</html>
